<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="FitTrack — personal fitness tracking for strength and cycling." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d10'/%3E%3Cpath d='M26 56c7-20 18-30 32-30 11 0 18 6 22 15' fill='none' stroke='%23ff6a00' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M22 63h56' stroke='%23f5f7fa' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <title>FitTrack</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div>
          <div class="brand-name">FitTrack</div>
          <div class="brand-subtitle">Personal fitness</div>
        </div>
      </div>
      <button class="icon-button" id="profileButton" aria-label="Open profile">AK</button>
    </header>

    <main id="app" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-route="workout"><span>◈</span><small>Workout</small></button>
      <button class="nav-item" data-route="ride"><span>◉</span><small>Ride</small></button>
      <button class="nav-item" data-route="history"><span>↺</span><small>History</small></button>
      <button class="nav-item" data-route="progress"><span>↗</span><small>Progress</small></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
