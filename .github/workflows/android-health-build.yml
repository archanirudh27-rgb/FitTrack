name: Build FitTrack Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-mobile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'health-connect-bridge.js'
      - 'health-dashboard.js'
      - 'health-home.js'
      - 'privacy-policy.html'
      - '.github/workflows/android-health-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build FitTrack mobile web bundle
        run: npm run mobile:build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
